<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <header>
    <h1>TaskFlow</h1>
  </header>
  <main>
    <dialog id="modal-formulario">
      <section class="formulario">
        <form id="form-criar-tarefa">
          <label for="titulo-tarefa">Digite a tarefa:</label>
          <input type="text" id="titulo-tarefa">
          <p class="form-error title" data-error-location="title" aria-live="polite"></p>

          <label for="descricao-tarefa">Descrição:</label>
          <textarea name="descricao-tarefa" id="descricao-tarefa"></textarea>
          <div class="task-meta">
            <div class="form-field"> <label for="prioridade-tarefa">Prioridade da tarefa:</label>
              <select name="prioridade-tarefa" id="prioridade-tarefa">
                <option value="low">Baixa</option>
                <option value="medium">Média</option>
                <option value="high">Alta</option>
              </select>
            </div>
            <div class="form-field">
              <label for="prazo-tarefa">Prazo Até:</label>
              <input type="date" name="prazo-tarefa" id="prazo-tarefa">
            </div>

          </div>
          <p class="form-error" data-error-location="date" aria-live="polite"></p>

          <button type="submit" id="btn-enviar-tarefa">Enviar</button>
          <button type="button" aria-label="Fechar Modal" class="btn-close-modal">X</button>
        </form>
      </section>
    </dialog>

    <section class="painel-acoes">
      <div>
        <label for="task-filter">Filtrar por Prioridade:</label>
        <select name="task-filter" id="task-filter">
          <option value="all">Todas</option>
          <option value="low">Baixa</option>
          <option value="medium">Média</option>
          <option value="high">Alta</option>
        </select>
      </div>
      <button id="nova-tarefa">Adicionar Nova Tarefa</button>


    </section>

    <section class="painel-task">
      <div class="painel-coluna">
        <h2 class="titulo-coluna todo">A fazer</h2>
        <ul class="task-coluna task-fazer" data-status="todo"></ul>
      </div>
      <div class="painel-coluna">
        <h2 class="titulo-coluna in-progress">Em Andamento</h2>
        <ul class="task-coluna task-andamento" data-status="in-progress"></ul>
      </div>
      <div class="painel-coluna">
        <h2 class="titulo-coluna done">Concluída</h2>
        <ul class="task-coluna task-concluida" data-status="done"></ul>
      </div>

    </section>
  </main>

  <script src="./js/main.js"></script>
</body>

</html>
