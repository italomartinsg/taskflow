<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <header>
    <h1>TaskFlow</h1>
  </header>
  <main>
    <section class="formulario">
      <form id="form-criar-task">
        <label for="titulo-tarefa">Digite a tarefa:</label>
        <input type="text" id="titulo-tarefa">
        <label for="prioridade-task">Prioridade da tarefa:</label>
        <select name="prioridade-task" id="prioridade-task">
          <option value="low">Baixa</option>
          <option value="medium">Média</option>
          <option value="high">Alta</option>
        </select>
        <button type="submit">Enviar</button>
      </form>
    </section>
    <section class="painel-task">
      <h2>A fazer</h2>
      <ul class="task-fazer"></ul>


    </section>
  </main>

  <script src="./js/main.js"></script>
</body>

</html>
