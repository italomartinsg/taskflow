<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <header>
    <h1>TaskFlow</h1>
  </header>
  <main>
    <section class="formulario">
      <form id="form-criar-tarefa">
        <label for="titulo-tarefa">Digite a tarefa:</label>
        <input type="text" id="titulo-tarefa">

        <label for="descricao-tarefa">Descrição:</label>
        <textarea name="descricao-tarefa" id="descricao-tarefa"></textarea>
        <label for="prioridade-tarefa">Prioridade da tarefa:</label>
        <select name="prioridade-tarefa" id="prioridade-tarefa">
          <option value="low">Baixa</option>
          <option value="medium">Média</option>
          <option value="high">Alta</option>
        </select>
        <label for="prazo-tarefa">Prazo Até:</label>
        <input type="date" name="prazo-tarefa" id="prazo-tarefa">
        <button type="submit" id="btn-enviar-tarefa">Enviar</button>
      </form>
    </section>
    <section class="painel-task">
      <h2>A fazer</h2>
      <ul class="task-coluna task-fazer" data-status="todo"></ul>
      <h2>Em Andamento</h2>
      <ul class="task-coluna task-andamento" data-status="in-progress"></ul>
      <h2>Concluída</h2>
      <ul class="task-coluna task-concluida" data-status="done"></ul>


    </section>
  </main>

  <script src="./js/main.js"></script>
</body>

</html>
